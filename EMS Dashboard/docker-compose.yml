version: '3.4'

services:

  web:
    image: nginx
    volumes:
        - ./public:/usr/share/nginx/html
        - ./certs:/etc/nginx/certs  # SSL certificates
        - ./nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
           - "80:80" 
           - "443:443" # Ports for  web
