
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate ./certs/localhost.crt;
        ssl_certificate_key ./certs/localhost.key;


        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
    }

    server {
        listen 80;
        server_name localhost;
         return 301 https://$host$request_uri;
    }

